[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "theker-telemetry"
version = "0.1.0"
description = "SDK de telemetría de la plataforma de observabilidad de THEKER"
requires-python = ">=3.11"
# Sin dependencias a propósito: PostgREST se habla con urllib de la stdlib. Cada
# paquete nuevo es algo que puede romperse la noche antes de la demo.
dependencies = []

# Solo para desarrollar y para CI. El SDK que importa la simulación sigue sin
# dependencias: nada de esto viaja con él.
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["theker_telemetry"]

[tool.pytest.ini_options]
# backfill.py y seed/ son scripts sueltos, no entran en el paquete instalado.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# El código se escribe a ~90 a mano; el límite está alto a propósito para que E501
# solo cace líneas desbocadas y no obligue a romper la tabla alineada de CAMPAIGN,
# donde la alineación ES lo que deja leer la curva de mejora de un vistazo.
line-length = 120

[tool.ruff.lint]
# Explícito a propósito: sin esto, el conjunto por defecto cambia con la versión de
# ruff y CI se pone rojo por algo que nadie ha tocado. E/F son los errores de verdad,
# I ordena los imports, UP evita que el código se quede en Python 3.8.
select = ["E", "F", "I", "UP"]
