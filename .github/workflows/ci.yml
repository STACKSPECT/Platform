# Lo mínimo que tiene que contestar un push: ¿aplica el SQL?, ¿siguen cuadrando el
# esquema y lo que el front consulta?, ¿compila la interfaz?
#
# El Postgres no es decoración: el último bug de esquema que se coló (`round()` sobre
# double precision) solo aparece EJECUTANDO el SQL, y el de `started_at` solo
# comparando las consultas del front contra las columnas de verdad.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # El test crea su propio esquema desechable y solo acepta localhost.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # el mínimo que declara pyproject

      # El SDK no tiene dependencias; pytest y ruff viven en el extra dev.
      - run: pip install -e './backend[dev]'

      - run: ruff check backend

      # psql viene de serie en ubuntu-latest; el test lo usa como cliente para no
      # meter psycopg solo para esto.
      - run: pytest backend -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # De pega, pero tienen que existir: createClient se evalúa al importar el módulo
      # y sin ellas el build se cae. Son públicas por definición, así que aquí no hay
      # nada que esconder; la service_role no aparece en el front jamás.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: clave-de-pega-para-compilar

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # `build` y no `tsc --noEmit`: Next 16 genera durante el build los tipos de
      # PageProps<'/runs/[id]'>, que es justo lo que van a necesitar las rutas
      # pendientes.
      - run: npm run build
